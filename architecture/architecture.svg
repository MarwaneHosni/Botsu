<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a93a6"/>
    </marker>
  </defs>
  <rect width="920" height="520" fill="#0e1220"/>

  <!-- Title -->
  <text x="40" y="36" fill="#ffffff" font-size="17" font-weight="700">Botsu: System Architecture</text>

  <!-- Layer 1: User -->
  <rect x="40" y="56" width="840" height="70" rx="12" fill="#171c2e" stroke="#313a5c"/>
  <rect x="58" y="72" width="150" height="38" rx="8" fill="#232941"/>
  <text x="133" y="90" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">User / Browser</text>
  <text x="230" y="92" fill="#b9c0d4" font-size="12">Renders the Next.js app; holds the Supabase client session (JWT)</text>

  <!-- Arrow user -> frontend -->
  <line x1="129" y1="134" x2="129" y2="162" stroke="#8a93a6" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="140" y="152" fill="#8a93a6" font-size="11">HTTPS</text>

  <!-- Layer 2: Frontend -->
  <rect x="40" y="166" width="840" height="120" rx="12" fill="#171c2e" stroke="#313a5c"/>
  <rect x="58" y="180" width="210" height="30" rx="8" fill="#ff6b35"/>
  <text x="163" y="200" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Next.js Application (Vercel)</text>

  <!-- Frontend boxes -->
  <rect x="58" y="222" width="170" height="46" rx="8" fill="#232941"/>
  <text x="143" y="241" fill="#ffffff" font-size="12" text-anchor="middle" font-weight="600">Reader</text>
  <text x="143" y="257" fill="#b9c0d4" font-size="10.5" text-anchor="middle">EPUB + IndexedDB cache</text>

  <rect x="244" y="222" width="170" height="46" rx="8" fill="#232941"/>
  <text x="329" y="241" fill="#ffffff" font-size="12" text-anchor="middle" font-weight="600">Study</text>
  <text x="329" y="257" fill="#b9c0d4" font-size="10.5" text-anchor="middle">SM-2 scheduler</text>

  <rect x="430" y="222" width="170" height="46" rx="8" fill="#232941"/>
  <text x="515" y="241" fill="#ffffff" font-size="12" text-anchor="middle" font-weight="600">Tracker / Progress</text>
  <text x="515" y="257" fill="#b9c0d4" font-size="10.5" text-anchor="middle">Heatmap + goals</text>

  <rect x="616" y="222" width="170" height="46" rx="8" fill="#232941"/>
  <text x="701" y="241" fill="#ffffff" font-size="12" text-anchor="middle" font-weight="600">Leaderboard / Profile</text>
  <text x="701" y="257" fill="#b9c0d4" font-size="10.5" text-anchor="middle">Public profiles</text>

  <!-- Arrow frontend -> API -->
  <line x1="129" y1="294" x2="129" y2="322" stroke="#8a93a6" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="140" y="312" fill="#8a93a6" font-size="11">JSON REST + Bearer JWT (CORS)</text>

  <!-- Layer 3: API -->
  <rect x="40" y="326" width="840" height="110" rx="12" fill="#171c2e" stroke="#313a5c"/>
  <rect x="58" y="340" width="250" height="30" rx="8" fill="#ff6b35"/>
  <text x="183" y="360" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Express API (Vercel Functions)</text>

  <rect x="58" y="382" width="250" height="42" rx="8" fill="#232941"/>
  <text x="183" y="400" fill="#ffffff" font-size="12" text-anchor="middle" font-weight="600">Auth middleware</text>
  <text x="183" y="416" fill="#b9c0d4" font-size="10.5" text-anchor="middle">Supabase service-role JWT verify</text>

  <rect x="328" y="382" width="250" height="42" rx="8" fill="#232941"/>
  <text x="453" y="400" fill="#ffffff" font-size="12" text-anchor="middle" font-weight="600">Domain services</text>
  <text x="453" y="416" fill="#b9c0d4" font-size="10.5" text-anchor="middle">Gamification · SRS · Aggregations</text>

  <rect x="598" y="382" width="250" height="42" rx="8" fill="#232941"/>
  <text x="723" y="400" fill="#ffffff" font-size="12" text-anchor="middle" font-weight="600">Resource routers</text>
  <text x="723" y="416" fill="#b9c0d4" font-size="10.5" text-anchor="middle">Books·Decks·Cards·Progress·Profiles·Uploads</text>

  <!-- Arrow API -> Supabase -->
  <line x1="129" y1="444" x2="129" y2="472" stroke="#8a93a6" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="140" y="462" fill="#8a93a6" font-size="11">Prisma ORM / Admin client</text>

  <!-- Layer 4: Supabase -->
  <rect x="40" y="476" width="840" height="34" rx="12" fill="#313a5c"/>
  <text x="129" y="498" fill="#ffffff" font-size="12.5" font-weight="700" text-anchor="middle">Supabase: PostgreSQL · Auth (JWT) · Storage (covers + avatars)</text>
</svg>